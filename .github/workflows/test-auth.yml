name: Test Google Cloud Authentication

on:
  push:
    branches: [ main ]

jobs:
  test-auth:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create service account key file
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
        cat /tmp/gcp-key.json | jq . || echo "JSON validation failed"
        
    - name: Authenticate with gcloud using key file
      run: |
        gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
        
    - name: Test gcloud authentication
      run: |
        gcloud auth list
        gcloud config list
        gcloud projects describe ${{ secrets.GCP_PROJECT_ID }}
        
    - name: Test Cloud Run access
      run: |
        gcloud run services list --region=${{ secrets.GCP_REGION }}
        
    - name: Clean up
      run: |
        rm -f /tmp/gcp-key.json
