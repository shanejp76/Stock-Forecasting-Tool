name: Test Google Cloud Authentication

on:
  push:
    branches: [ main ]

jobs:
  test-auth:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check all required secrets
      run: |
        echo "Checking required secrets..."
        
        # Check GCP_SERVICE_ACCOUNT_KEY
        if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
          echo "❌ GCP_SERVICE_ACCOUNT_KEY is not set"
        else
          echo "✅ GCP_SERVICE_ACCOUNT_KEY is set (length: $(echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' | wc -c))"
        fi
        
        # Check GCP_PROJECT_ID
        if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
          echo "❌ GCP_PROJECT_ID is not set"
        else
          echo "✅ GCP_PROJECT_ID is set: ${{ secrets.GCP_PROJECT_ID }}"
        fi
        
        # Check GCP_REGION
        if [ -z "${{ secrets.GCP_REGION }}" ]; then
          echo "❌ GCP_REGION is not set"
        else
          echo "✅ GCP_REGION is set: ${{ secrets.GCP_REGION }}"
        fi
        
        # Validate we have all required secrets
        if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ] || [ -z "${{ secrets.GCP_PROJECT_ID }}" ] || [ -z "${{ secrets.GCP_REGION }}" ]; then
          echo ""
          echo "❌ ERROR: Missing required secrets"
          echo "Please ensure these secrets are set in GitHub:"
          echo "- GCP_SERVICE_ACCOUNT_KEY"
          echo "- GCP_PROJECT_ID"  
          echo "- GCP_REGION"
          exit 1
        fi
        
        echo "✅ All required secrets are configured"
        
    - name: Create and validate service account key file
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
        echo "File created, size: $(stat -c%s /tmp/gcp-key.json 2>/dev/null || stat -f%z /tmp/gcp-key.json)"
        echo "Validating JSON..."
        if ! jq . /tmp/gcp-key.json > /dev/null 2>&1; then
          echo "ERROR: Invalid JSON in service account key"
          echo "First few lines of file:"
          head -5 /tmp/gcp-key.json
          exit 1
        fi
        echo "JSON is valid"
        echo "Service account email: $(jq -r .client_email /tmp/gcp-key.json)"
        echo "Project ID: $(jq -r .project_id /tmp/gcp-key.json)"
        
    - name: Try alternative authentication method
      run: |
        echo "Trying direct gcloud auth activation..."
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' | gcloud auth activate-service-account --key-file=-
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
        echo "Authentication successful!"
        
    - name: Test gcloud authentication
      run: |
        echo "Testing authentication..."
        gcloud auth list
        gcloud config list
        echo "Testing project access..."
        gcloud projects describe ${{ secrets.GCP_PROJECT_ID }}
        
    - name: Test Cloud Run access
      run: |
        echo "Testing Cloud Run access..."
        gcloud run services list --region=${{ secrets.GCP_REGION }} || echo "No services found (this is normal)"
        
    - name: Clean up
      run: |
        rm -f /tmp/gcp-key.json
