version: '3.8'

services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
      # Uses requirements.txt with pinned versions for consistent builds
    ports:
      - "8501:8501"
    environment:
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    volumes:
      # Mount for development (comment out for production)
      - .:/app
      # Persist any local data
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a database service for future use
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: stockforecasting
  #     POSTGRES_USER: stockuser
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

  # Optional: Add Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped

volumes:
  app-data:
  # postgres-data:
  # redis-data:

networks:
  default:
    name: stock-forecasting-network
